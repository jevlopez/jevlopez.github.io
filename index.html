<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jorge Vásquez - Portafolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        
        .projects {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .project-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: 600;
            width: 100%;
        }
        
        .project-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .footer-text {
            color: #999;
            font-size: 0.9em;
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Bienvenido! 👋</h1>
        <p>Soy <strong>Jorge Vásquez</strong>, desarrollador web apasionado por crear experiencias digitales increíbles.</p>
        
        <div class="projects">
            <a href="GUIA_TURISTICA/index.html" class="project-link">
                🌍 Explorar Guía Turística
            </a>
        </div>
        
        <p style="color: #999; font-size: 0.95em;">Descubre los mejores destinos y lugares turísticos en nuestro país.</p>
        
        <div class="footer-text">
            <p>&copy; 2026 Jorge Vásquez. Todos los derechos reservados.</p>
        </div>
    </div>
</body>
</html>
